<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-labelledby="title desc">
  <title id="title">79mods mark</title>
  <desc id="desc">79mods compact brand mark.</desc>
  <defs>
    <linearGradient id="markGradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ff46d9"/>
      <stop offset="24%" stop-color="#ff5bb8"/>
      <stop offset="52%" stop-color="#4f87ff"/>
      <stop offset="79%" stop-color="#59d9ff"/>
      <stop offset="100%" stop-color="#9d74f7"/>
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff5ac8" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#58d9ff" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#markGlow)">
    <text x="18" y="104" font-size="98" font-weight="900" font-style="italic" letter-spacing="-5" font-family="Arial Black, Impact, sans-serif" fill="url(#markGradient)">79</text>
  </g>
</svg>
