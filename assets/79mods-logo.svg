<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">79mods logo</title>
  <desc id="desc">79mods brand wordmark with bright neon gradient.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ff46d9"/>
      <stop offset="22%" stop-color="#ff5bb8"/>
      <stop offset="52%" stop-color="#4d82ff"/>
      <stop offset="78%" stop-color="#58d9ff"/>
      <stop offset="100%" stop-color="#9f6ef7"/>
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ff59c6"/>
      <stop offset="50%" stop-color="#5e8cff"/>
      <stop offset="100%" stop-color="#6ae1ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff5ac8" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#60d9ff" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <text x="18" y="142" font-size="154" font-weight="900" font-style="italic" letter-spacing="-9" font-family="Arial Black, Impact, sans-serif" fill="url(#brandGradient)">79</text>
    <text x="314" y="142" font-size="110" font-weight="900" letter-spacing="-5" font-family="Arial Black, Impact, sans-serif" fill="url(#brandGradient)">MODS</text>
  </g>

  <rect x="330" y="160" width="390" height="14" rx="7" fill="url(#brandAccent)" opacity="0.98"/>
</svg>
